name: Kokora
options:
  bundleIdPrefix: com.kokora
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: "4.6.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.30.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"

targets:
  Kokora:
    type: application
    platform: iOS
    sources:
      - path: Kokora
    resources:
      - path: Kokora/Resources
    settings:
      base:
        INFOPLIST_FILE: Kokora/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.kokora.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
    entitlements:
      path: Kokora/Kokora.entitlements
    dependencies:
      - package: Lottie
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleSignIn
        product: GoogleSignInSwift
    scheme:
      testTargets:
        - KokoraTests
      gatherCoverageData: true
  KokoraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KokoraTests
    dependencies:
      - target: Kokora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Kokora.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Kokora"
        BUNDLE_LOADER: "$(TEST_HOST)"
