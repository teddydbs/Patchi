name: Patchi
options:
  bundleIdPrefix: com.patchi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Patchi:
    type: application
    platform: iOS
    sources:
      - path: Patchi
    resources:
      - path: Patchi/Resources
    settings:
      base:
        INFOPLIST_FILE: Patchi/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.patchi.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
    entitlements:
      path: Patchi/Patchi.entitlements
    dependencies: []
    scheme:
      testTargets: []
      gatherCoverageData: false
